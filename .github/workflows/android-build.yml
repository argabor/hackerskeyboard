name: Android Build\n\non: [push, pull_request]\n\njobs:\n  build:\n    runs-on: ubuntu-latest\n    steps:\n      - name: Check out code\n        uses: actions/checkout@v2\n      - name: Set up JDK\n        uses: actions/setup-java@v1\n        with:\n          java-version: '11'\n      - name: Build\n        run: ./gradlew build\n      - name: Upload Artifacts\n        uses: actions/upload-artifact@v4\n        with:\n          name: build-artifacts\n          path: app/build/outputs/\n